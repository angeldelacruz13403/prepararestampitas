<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ (seo.title if seo else default_meta.title) | e }}</title>
  <meta name="description" content="{{ (seo.description if seo else default_meta.description) | e }}">
  {% if seo %}
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta property="og:title" content="{{ seo.og.title | e }}">
  <meta property="og:description" content="{{ seo.og.description | e }}">
  <meta property="og:url" content="{{ seo.og.url }}">
  <meta property="og:image" content="{{ seo.og.image }}">
  <meta name="twitter:card" content="{{ seo.twitter.card }}">
  <meta name="twitter:title" content="{{ seo.twitter.title | e }}">
  <meta name="twitter:description" content="{{ seo.twitter.description | e }}">
  <meta name="twitter:image" content="{{ seo.twitter.image }}">
  <script type="application/ld+json">{{ seo.json_ld | tojson }}</script>
  {% endif %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  {% include "partials/nav.html" %}
  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container border-top py-3 small text-muted">© {{ default_meta.title }}</footer>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
